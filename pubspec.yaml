name: chessground
description: Chess board UI developed for lichess.org. It has no chess logic inside so it can be used for chess variants.
version: 10.3.0
repository: https://github.com/lichess-org/flutter-chessground
funding:
  - https://lichess.org/patron

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=3.29.0"

dependencies:
  dartchess: ^0.14.0
  flutter:
    sdk: flutter
  meta: ^1.18.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.8.0
  material_ui: any
  mocktail: ^1.0.5

flutter:
  assets:
    - assets/piece_sets/syntoxan/
    - assets/boards/
    
